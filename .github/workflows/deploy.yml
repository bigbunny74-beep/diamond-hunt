name: 🎮 Build & Deploy Diamond Hunt

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:

  # ── Deploy to GitHub Pages (play in browser) ───────────────────────────
  pages:
    name: 🌐 Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deploy
        uses: actions/deploy-pages@v4

  # ── Build Android APK (install on phone) ──────────────────────────────
  apk:
    name: 📱 Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Build APK with Gradle
        run: |
          # Install Android SDK build tools
          yes | sdkmanager "build-tools;34.0.0" "platforms;android-34" 2>/dev/null | tail -1

          # Create minimal Android project on the fly
          mkdir -p app/src/main/java/com/diamondhunt/game
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/values

          # Copy game + assets
          cp index.html app/src/main/assets/
          [ -f board.png ]       && cp board.png       app/src/main/assets/
          [ -f title-music.mp3 ] && cp title-music.mp3 app/src/main/assets/

          # Fix paths for Android local assets
          sed -i 's|"./board.png"|"file:///android_asset/board.png"|g' app/src/main/assets/index.html
          sed -i 's|"./title-music.mp3"|"file:///android_asset/title-music.mp3"|g' app/src/main/assets/index.html

          # AndroidManifest
          cat > app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              package="com.diamondhunt.game">
            <uses-permission android:name="android.permission.VIBRATE"/>
            <uses-permission android:name="android.permission.INTERNET"/>
            <application
                android:label="Diamond Hunt"
                android:icon="@mipmap/ic_launcher"
                android:hardwareAccelerated="true"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
              <activity android:name=".MainActivity"
                  android:exported="true"
                  android:screenOrientation="portrait"
                  android:configChanges="orientation|screenSize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          XML

          # MainActivity
          cat > app/src/main/java/com/diamondhunt/game/MainActivity.java << 'JAVA'
          package com.diamondhunt.game;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.*;
          public class MainActivity extends Activity {
            WebView wv;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                                   WindowManager.LayoutParams.FLAG_FULLSCREEN);
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_FULLSCREEN|View.SYSTEM_UI_FLAG_HIDE_NAVIGATION|
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              wv = new WebView(this);
              WebSettings s = wv.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              wv.setWebViewClient(new WebViewClient());
              wv.setWebChromeClient(new WebChromeClient());
              wv.loadUrl("file:///android_asset/index.html");
              setContentView(wv);
            }
            @Override protected void onPause()  { super.onPause();  wv.onPause();  wv.pauseTimers(); }
            @Override protected void onResume() { super.onResume(); wv.onResume(); wv.resumeTimers(); }
            @Override public void onBackPressed() {}
          }
          JAVA

          # Minimal icon PNG (red diamond, 48px)
          python3 -c "
          import struct,zlib,math
          def chunk(t,d):
            c=t+d; return struct.pack('>I',len(d))+c+struct.pack('>I',zlib.crc32(c)&0xffffffff)
          def icon(sz):
            cx=cy=sz/2; hw=cx*0.78; hh=cy*0.82; rows=[]
            for y in range(sz):
              r=b'\x00'
              for x in range(sz):
                in_d=(abs(x-cx)/hw+abs(y-cy)/hh)<=1
                if in_d:
                  t=(x+y)/(sz*2)
                  if t<0.3: c=(220,240,255,255)
                  elif t<0.6: c=(100,170,240,255)
                  else: c=(32,96,192,255)
                else: c=(26,8,0,255)
                r+=bytes(c)
              rows.append(r)
            raw=b''.join(rows)
            sig=b'\x89PNG\r\n\x1a\n'
            ihdr=chunk(b'IHDR',struct.pack('>IIBBBBB',sz,sz,8,6,0,0,0))
            idat=chunk(b'IDAT',zlib.compress(raw,6))
            iend=chunk(b'IEND',b'')
            return sig+ihdr+idat+iend
          open('app/src/main/res/mipmap-hdpi/ic_launcher.png','wb').write(icon(72))
          open('app/src/main/res/mipmap-xxxhdpi/ic_launcher.png','wb').write(icon(192))
          print('icons ok')
          "

          # Strings
          cat > app/src/main/res/values/strings.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Diamond Hunt</string></resources>
          XML

          # build.gradle files
          cat > settings.gradle << 'GRADLE'
          include ':app'
          GRADLE

          cat > build.gradle << 'GRADLE'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE

          cat > app/build.gradle << 'GRADLE'
          apply plugin: 'com.android.application'
          android {
            compileSdkVersion 34
            defaultConfig {
              applicationId "com.diamondhunt.game"
              minSdkVersion 21
              targetSdkVersion 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes { debug { minifyEnabled false } }
          }
          dependencies { implementation 'androidx.appcompat:appcompat:1.6.1' }
          GRADLE

          cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.2-bin.zip
          PROPS

          # Build
          gradle assembleDebug --no-daemon --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DiamondHunt
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "📱 Diamond Hunt — Install on Android"
          body: |
            ## Install Diamond Hunt on Android

            1. Download **app-debug.apk** below  
            2. Open it on your Android phone  
            3. Tap **Install** (allow unknown sources if asked)  

            ✅ Works fully offline after install  
            🎮 Also playable in browser: https://bigbunny74-beep.github.io/diamond-hunt
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
