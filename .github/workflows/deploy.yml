name: Build Diamond Hunt APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/diamondhunt/game
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          cp index.html app/src/main/assets/
          [ -f board.png ]       && cp board.png       app/src/main/assets/
          [ -f title-music.mp3 ] && cp title-music.mp3 app/src/main/assets/

          # URLs auto-detect file:// vs http:// at runtime — no patching needed

          cat > app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application
                android:label="Diamond Hunt"
                android:icon="@mipmap/ic_launcher"
                android:hardwareAccelerated="true"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
              <activity android:name=".MainActivity"
                  android:exported="true"
                  android:screenOrientation="portrait"
                  android:configChanges="orientation|screenSize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          XML

          cat > app/src/main/java/com/diamondhunt/game/MainActivity.java << 'JAVA'
          package com.diamondhunt.game;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.*;
          public class MainActivity extends Activity {
            WebView wv;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                                   WindowManager.LayoutParams.FLAG_FULLSCREEN);
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_FULLSCREEN |
                View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              wv = new WebView(this);
              WebSettings s = wv.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              wv.setWebViewClient(new WebViewClient());
              wv.setWebChromeClient(new WebChromeClient());
              wv.loadUrl("file:///android_asset/index.html");
              setContentView(wv);
            }
            @Override protected void onPause()  { super.onPause();  wv.onPause();  wv.pauseTimers(); }
            @Override protected void onResume() { super.onResume(); wv.onResume(); wv.resumeTimers(); }
            @Override public void onBackPressed() {}
          }
          JAVA

          python3 << 'PYEOF'
import struct,zlib,math,os
def chunk(t,d):
  c=t+d; return struct.pack('>I',len(d))+c+struct.pack('>I',zlib.crc32(c)&0xffffffff)
def clamp(v): return max(0,min(255,int(v)))
def make_icon(sz):
  cx=cy=sz/2.0; pad=sz*0.08; hw=cx-pad; hh=cy-pad
  top=(cx,pad); bot=(cx,sz-pad)
  rows=[]
  for y in range(sz):
    row=b'\x00'
    for x in range(sz):
      in_d=(abs(x-cx)/hw+abs(y-cy)/hh)<=1.0
      if not in_d:
        dx,dy=(x-cx)/cx,(y-cy)/cy
        dist=math.sqrt(dx*dx+dy*dy)
        bg_t=min(1.0,dist*0.7)
        row+=bytes([clamp(20+bg_t*10),clamp(6+bg_t*4),0,255])
        continue
      if y<=cy:
        nx=(x-cx)/hw; ny=-(y-cy)/hh
        ts=0.42
        if abs(nx)+abs(ny)<ts:
          t=(abs(nx)+abs(ny))/ts
          r=clamp(210+(1-t)*45); g=clamp(230+(1-t)*25); b=255
        else:
          ang=math.atan2(ny,nx)
          sec=int((ang+math.pi)/(math.pi/4))%8
          base=(165,215,255) if sec%2==0 else (85,145,220)
          et=max(0,min(1,(abs(nx)+abs(ny)-ts)/(1-ts)))
          r=clamp(base[0]*(1-et*0.45)); g=clamp(base[1]*(1-et*0.40)); b=clamp(base[2]*(1-et*0.20))
        hlx=cx-hw*0.20; hly=top[1]+hh*0.18; hlr=sz*0.12
        hld=math.sqrt((x-hlx)**2+(y-hly)**2)/hlr
        if hld<1.0:
          ht=(1-hld)**2.2*0.75; r=clamp(r+(255-r)*ht); g=clamp(g+(255-g)*ht); b=clamp(b+(255-b)*ht)
      else:
        nx=(x-cx)/hw; ny=(y-cy)/hh
        ang=math.atan2(ny,nx)
        sec=int((ang+math.pi)/(math.pi/4))%8
        base=(35,85,175) if sec%2==1 else (65,125,210)
        r=clamp(base[0]*(1-ny*0.60)); g=clamp(base[1]*(1-ny*0.55)); b=clamp(base[2]*(1-ny*0.30))
      gd=abs(y-cy); gw=max(1.0,sz*0.012)
      if gd<gw:
        gt=(1-gd/gw)**1.5
        r=clamp(r*(1-gt)+230*gt); g=clamp(g*(1-gt)+175*gt); b=clamp(b*(1-gt)+20*gt)
      ev=abs(x-cx)/hw+abs(y-cy)/hh; ed=(1-ev)*min(hw,hh); ow=max(1.2,sz*0.018)
      if ed<ow:
        ot=(1-ed/ow)**2*0.85
        r=clamp(r*(1-ot)+240*ot); g=clamp(g*(1-ot)+185*ot); b=clamp(b*(1-ot)+15*ot)
      row+=bytes([r,g,b,255])
    rows.append(row)
  raw=b''.join(rows)
  sig=b'\x89PNG\r\n\x1a\n'
  ihdr=chunk(b'IHDR',struct.pack('>IIBBBBB',sz,sz,8,6,0,0,0))
  idat=chunk(b'IDAT',zlib.compress(raw,6))
  iend=chunk(b'IEND',b'')
  return sig+ihdr+idat+iend
for folder,sz in [('mipmap-mdpi',48),('mipmap-hdpi',72),('mipmap-xhdpi',96),('mipmap-xxhdpi',144),('mipmap-xxxhdpi',192)]:
  os.makedirs(f'app/src/main/res/{folder}',exist_ok=True)
  open(f'app/src/main/res/{folder}/ic_launcher.png','wb').write(make_icon(sz))
  print(f'icon {folder} {sz}px')
PYEOF

          cat > app/src/main/res/values/strings.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Diamond Hunt</string></resources>
          XML

          cat > settings.gradle << 'GRADLE'
          include ':app'
          GRADLE

          cat > build.gradle << 'GRADLE'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.7.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE

          cat > app/build.gradle << 'GRADLE'
          apply plugin: 'com.android.application'
          android {
            namespace "com.diamondhunt.game"
            compileSdkVersion 34
            defaultConfig {
              applicationId "com.diamondhunt.game"
              minSdkVersion 21
              targetSdkVersion 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes { debug { minifyEnabled false } }
          }
          GRADLE

          cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          PROPS

          gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiamondHunt
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Diamond Hunt — Latest APK"
          body: |
            ## Install on Android

            1. Download **app-debug.apk** below
            2. Open it on your Android phone
            3. Tap **Install**

            ✅ Fully offline after install
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
