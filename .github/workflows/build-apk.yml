name: Build APK + Deploy to GitHub Pages

on:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  build-apk:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
      - uses: android-actions/setup-android@v3
      - name: Copy assets
        run: |
          cp assets/board.png        android/app/src/main/assets/board.png
          cp assets/title-music.mp3  android/app/src/main/assets/title-music.mp3
      - uses: gradle/actions/setup-gradle@v3
      - name: Build APK
        working-directory: android
        run: gradle assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: diamond-hunt-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 90
      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "Diamond Hunt — Latest Build"
          body: |
            ## Install on Android
            1. Download **app-debug.apk** below
            2. Open on Android, tap Install
            3. Fully offline after install
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  deploy-pages:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Build site
        run: |
          mkdir -p _site
          cp diamond-hunt-3-3-fixed.html _site/index.html
          cp assets/board.png            _site/board.png
          cp assets/title-music.mp3      _site/title-music.mp3
          cp manifest.json               _site/manifest.json
          cp sw.js                       _site/sw.js
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png _site/icon-192.png
          cp android/app/src/main/res/mipmap-xxxhdpi/ic_launcher_round.png _site/icon-512.png
          sed -i 's|file:///android_asset/board.png|./board.png|g'              _site/index.html
          sed -i 's|file:///android_asset/title-music.mp3|./title-music.mp3|g'  _site/index.html
      - uses: actions/configure-pages@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
