name: Build Diamond Hunt APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Copy assets into Android project
        run: |
          cp assets/board.png android/app/src/main/assets/board.png
          cp assets/title-music.mp3 android/app/src/main/assets/title-music.mp3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug --no-daemon

      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: diamond-hunt-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: "Diamond Hunt — Build ${{ github.run_number }}"
          body: |
            ## Standalone Offline APK
            
            Download and install directly on Android.
            
            **To install:**
            1. Download `app-debug.apk` below
            2. Open it on your Android device
            3. Allow "Install from unknown sources" if prompted
          files: android/app/build/outputs/apk/debug/app-debug.apk
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
